{% extends "base.html" %}
{% block content %}
<section class="intro"><h1>{% block heading %}{% endblock %}</h1></section>
<div class="grid">
  {% for article in (articles_page.object_list if articles_page else articles) %}
  <article class="card">
    <p class="meta"><time datetime="{{ article.date.isoformat() }}">{{ article.locale_date }}</time></p>
    <h2><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></h2>
    <p>{{ article.summary | striptags | truncate(180) }}</p>
  </article>
  {% endfor %}
</div>
{% endblock %}
