# What the blog researches. The Blog workflow asks the backend for a draft on
# Mon, Wed and Fri; each run follows schedule[<weekday>]. The admin's Blog tab
# browses these categories too. Source types are the keys of FETCHERS in
# sources/__init__.py.
llm:
  model: openai/gpt-oss-120b  # falls back to the best live Groq model if unavailable
  max_items: 5

schedule:
  mon: {type: deep, weights: {websites: 30, marketing: 30, ai_business: 20}}
  wed: {type: pulse, name: SA Small Business Pulse, categories: [sa_business]}
  fri: {type: deep, weights: {marketing: 25, ai_business: 25, websites: 20, ecommerce: 20, space_tech: 10}}

categories:
  websites:
    name: Websites & Domains
    keywords: [website, web design, domain, hosting, landing page, seo, page speed, mobile, google business profile, ssl]
    sources:
      - {type: rss, url: "https://developers.google.com/search/blog/feeds/atom.xml", max: 10}
      - {type: rss, url: "https://www.smashingmagazine.com/feed/", max: 10}
      - {type: serpapi_news, query: "small business website domain", gl: za, max: 10}
      - {type: semantic_scholar, query: "small business website adoption", max: 10}
    topics:
      - why a business needs its own website, not just social media
      - choosing and protecting a .co.za domain
      - what makes a small business website convert visitors
      - Google Business Profile basics
      - website speed and mobile-friendliness

  marketing:
    name: Marketing & Growth
    keywords: [marketing, seo, social media, whatsapp, google ads, facebook, instagram, customers, reviews, leads]
    sources:
      - {type: rss, url: "https://www.socialmediaexaminer.com/feed/", max: 12}
      - {type: rss, url: "https://blog.hubspot.com/marketing/rss.xml", max: 12}
      - {type: serpapi_news, query: "small business marketing South Africa", gl: za, max: 10}
      - {type: semantic_scholar, query: "social media marketing small business", max: 10}
      - {type: semantic_scholar, query: "local search engine optimization", max: 8}
    topics:
      - getting more Google reviews
      - WhatsApp Business for customer service
      - local SEO for township and suburb businesses
      - low-budget social media content
      - turning website visitors into leads

  ai_business:
    name: AI for Small Business
    keywords: [ai, chatgpt, chatbot, automation, whatsapp bot, assistant, small business, tool, productivity, llm]
    sources:
      - {type: hn, query: "AI small business", max: 15}
      - {type: rss, url: "https://huggingface.co/blog/feed.xml", max: 10}
      - {type: serpapi_news, query: "AI tools small business", gl: za, max: 10}
      - {type: arxiv, query: "cat:cs.AI AND (abs:business OR abs:enterprise OR abs:customer)", max: 15}
      - {type: semantic_scholar, query: "generative AI small and medium enterprises", max: 10}
    topics:
      - AI chatbots that answer customers after hours
      - using AI to write product descriptions and posts
      - AI tools a one-person business can use today
      - risks of AI: accuracy, privacy and customer trust

  ecommerce:
    name: Selling Online
    keywords: [ecommerce, online store, payments, payfast, yoco, delivery, checkout, conversion, shopify, marketplace]
    sources:
      - {type: rss, url: "https://techcabal.com/feed/", max: 15}
      - {type: serpapi_news, query: "South Africa ecommerce online shopping", gl: za, max: 10}
      - {type: semantic_scholar, query: "e-commerce adoption SMEs Africa", max: 10}
    topics:
      - taking card payments online as a small business
      - delivery options for small online shops in SA
      - building trust so first-time customers buy
      - selling on marketplaces vs your own site

  sa_business:
    name: SA Business News
    keywords: [south africa, sme, small business, startup, fintech, load shedding, rand, sars, tax, funding]
    sources:
      - {type: rss, url: "https://businesstech.co.za/news/feed/", max: 15}
      - {type: rss, url: "https://techcabal.com/feed/", max: 15}
      - {type: serpapi_news, query: "South Africa small business SME", gl: za, max: 15}
      - {type: semantic_scholar, query: "South Africa small business informal sector", max: 10}
    topics:
      - registering a business and staying tax compliant
      - funding and grants for SA small businesses
      - running a business through load shedding
      - digital skills for small business owners

  space_tech:
    name: Space & Tech
    keywords: [nasa, space, satellite, telescope, starlink, internet, science, innovation, sansa, launch]
    sources:
      - {type: nasa_apod, count: 5}
      - {type: serpapi_news, query: "space technology satellite internet South Africa", gl: za, max: 10}
      - {type: serpapi_news, query: "NASA discovery", max: 10}
      - {type: arxiv, query: "cat:astro-ph.EP OR cat:astro-ph.IM", max: 15}
    topics:
      - satellite internet and connectivity for rural businesses
      - what space science teaches about innovation
      - South Africa's role in astronomy (SKA, SALT)
