AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Vicinic site-builder backend (Django + Mangum on Lambda)

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon Postgres connection string
  DjangoSecretKey:
    Type: String
    NoEcho: true
  DjangoAllowedHosts:
    Type: String
    Default: "*"
  TemplifyFunctionUrl:
    Type: String
    Default: "https://dmt46thjvn6fyzwxfmpfwae7li0ccmyc.lambda-url.eu-west-1.on.aws/"
  DefaultFromEmail:
    Type: String
    Default: ""
  ContactRecipientEmail:
    Type: String
    Default: ""
  FrontendOrigins:
    Type: String
    Default: ""
    Description: Comma-separated Cloudflare Pages origins allowed to call /api/... with credentials (e.g. the portal app)
  PayFastMerchantId:
    Type: String
    Default: "10000100"
    Description: PayFast merchant ID — defaults to PayFast's own public sandbox test-merchant value
  PayFastMerchantKey:
    Type: String
    Default: "46f0cd694581a"
    NoEcho: true
  PayFastPassphrase:
    Type: String
    Default: ""
    NoEcho: true
  PayFastSandbox:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  CloudflareApiToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Zone:Edit/Zone:DNS:Edit/Zone Email Routing Rules:Edit/Account:Zone:Edit token — see builder/services/cloudflare.py
  CloudflareAccountId:
    Type: String
    Default: ""
    Description: The Cloudflare account every connected customer domain becomes a zone under
  PlatformOriginHost:
    Type: String
    Default: "uoby5fryqkhbasb7wicrtg5oiq0pgwth.lambda-url.eu-west-1.on.aws"
    Description: This backend's own Lambda Function URL host (no scheme) — same pattern as TemplifyFunctionUrl above, a connected domain's zone gets pointed at this
  Stage:
    Type: String
    Default: prod

Globals:
  Function:
    # A Lambda Function URL (see DjangoFunction below) invokes synchronously
    # via the plain Invoke API, which allows the full Lambda timeout (up to
    # 900s) — unlike API Gateway's HTTP API, which enforces its own hard,
    # non-increasable 30s cap regardless of this value. This is the same
    # deployment pattern Templify itself uses.
    Timeout: 120
    MemorySize: 1536
    Runtime: python3.11

Resources:
  # Template assets (CSS/JS/images/fonts uploaded via the template manager)
  # must survive Lambda's ephemeral filesystem, and need to be reachable
  # directly by browsers — public-read, not routed through the Lambda.
  TemplateAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  TemplateAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplateAssetsBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${TemplateAssetsBucket.Arn}/*"

  DjangoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: config.lambda_handler.handler
      CodeUri: .
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          DJANGO_SECRET_KEY: !Ref DjangoSecretKey
          DJANGO_ALLOWED_HOSTS: !Ref DjangoAllowedHosts
          DJANGO_DEBUG: "false"
          TEMPLIFY_FUNCTION_URL: !Ref TemplifyFunctionUrl
          DEFAULT_FROM_EMAIL: !Ref DefaultFromEmail
          CONTACT_RECIPIENT_EMAIL: !Ref ContactRecipientEmail
          AWS_STORAGE_BUCKET_NAME: !Ref TemplateAssetsBucket
          FRONTEND_ORIGINS: !Ref FrontendOrigins
          PAYFAST_MERCHANT_ID: !Ref PayFastMerchantId
          PAYFAST_MERCHANT_KEY: !Ref PayFastMerchantKey
          PAYFAST_PASSPHRASE: !Ref PayFastPassphrase
          PAYFAST_SANDBOX: !Ref PayFastSandbox
          CLOUDFLARE_API_TOKEN: !Ref CloudflareApiToken
          CLOUDFLARE_ACCOUNT_ID: !Ref CloudflareAccountId
          PLATFORM_ORIGIN_HOST: !Ref PlatformOriginHost
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TemplateAssetsBucket
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API (Lambda Function URL)
    Value: !GetAtt DjangoFunctionUrl.FunctionUrl
  TemplateAssetsBucketName:
    Description: S3 bucket storing uploaded template assets
    Value: !Ref TemplateAssetsBucket
