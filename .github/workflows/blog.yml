name: Blog

# Drafts a researched post Mon/Wed/Fri and sends it to the admin's Blog tab
# for review. Every hour, posts approved there (or whose review window ran
# out) are committed to frontend/blog/content/posts, which rebuilds
# blog.vicinic.co.za.

on:
  schedule:
    - cron: "47 4 * * 1,3,5"
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "draft or publish"
        default: draft
      type:
        description: "draft only: auto, deep or pulse"
        default: auto
      category:
        description: "draft only: deep category key (websites, marketing, ai_business, ecommerce, sa_business)"
        default: ""

permissions:
  contents: write

concurrency:
  group: blog-${{ github.event.schedule || inputs.job }}

jobs:
  draft:
    if: github.event.schedule == '47 4 * * 1,3,5' || inputs.job == 'draft'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r research/requirements.txt
      - env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.AWS_DJANGO_SECRET_KEY }}
          POST_TYPE: ${{ inputs.type || 'auto' }}
          POST_CATEGORY: ${{ inputs.category }}
        run: |
          args=(--type "$POST_TYPE")
          [ -n "$POST_CATEGORY" ] && args+=(--category "$POST_CATEGORY")
          python -m research.run "${args[@]}"

  publish:
    if: github.event.schedule == '23 * * * *' || inputs.job == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/blog
    env:
      DJANGO_SECRET_KEY: ${{ secrets.AWS_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m research.publish
      - name: Commit new posts
        run: |
          git add content/posts
          if ! git diff --cached --quiet; then
            git config user.name "vicinic-blog-bot"
            git config user.email "vicinic-blog-bot@users.noreply.github.com"
            git commit -m "Blog: publish $(git diff --cached --name-only | wc -l) post(s)"
            git push
          fi
          # Also covers posts already committed by a run that failed to confirm.
          python -m research.publish --confirm
