name: Blog

# Mon/Wed/Fri the backend researches and drafts a post (backend/blog_research)
# for review in the admin's Blog tab. Approving a post there starts the publish
# job at once (the backend dispatches it); a daily run also picks up drafts
# whose review window ran out. Publishing commits posts to
# frontend/blog/content/posts, which rebuilds blog.vicinic.co.za.

on:
  schedule:
    - cron: "47 4 * * 1,3,5"
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "draft or publish"
        default: draft
      type:
        description: "draft only, with a category: deep or pulse"
        default: deep
      category:
        description: "draft only: deep category key (websites, marketing, ai_business, ecommerce, sa_business, space_tech)"
        default: ""

permissions:
  contents: write

concurrency:
  group: blog-${{ github.event.schedule || inputs.job }}

jobs:
  draft:
    if: github.event.schedule == '47 4 * * 1,3,5' || inputs.job == 'draft'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r research/requirements.txt
      - env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          POST_CATEGORY: ${{ inputs.category }}
          POST_TYPE: ${{ inputs.type || 'deep' }}
        run: python -m research.api "$POST_CATEGORY" "$POST_TYPE"

  publish:
    if: github.event.schedule == '23 4 * * *' || inputs.job == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/blog
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r research/requirements.txt
      - run: python -m research.publish
      - name: Commit new posts
        run: |
          git add content/posts
          if ! git diff --cached --quiet; then
            git config user.name "vicinic-blog-bot"
            git config user.email "vicinic-blog-bot@users.noreply.github.com"
            git commit -m "Blog: publish $(git diff --cached --name-only | wc -l) post(s)"
            git push
          fi
          # Also covers posts already committed by a run that failed to confirm.
          python -m research.publish --confirm
