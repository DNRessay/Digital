name: Backend CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-key
        run: python manage.py check

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Collect static files
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py collectstatic --noinput

      - name: One-time fix - reset stale builder migration history
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python manage.py shell -c "
          from django.db import connection
          with connection.cursor() as cur:
              cur.execute(\"SELECT to_regclass('builder_herocontent')\")
              if cur.fetchone()[0] is not None:
                  cur.execute('DROP TABLE IF EXISTS builder_herocontent, builder_aboutcontent, builder_service, builder_galleryimage, builder_testimonial, builder_site CASCADE')
                  cur.execute(\"DELETE FROM django_migrations WHERE app = 'builder'\")
                  print('Reset legacy builder schema (migration-name collision from the earlier model rewrite).')
              else:
                  print('No legacy builder schema found - nothing to reset.')
          "

      - name: Run database migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py migrate --noinput

      - uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: sam build
        working-directory: backend
        run: sam build

      - name: sam deploy
        working-directory: backend
        env:
          AWS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          AWS_DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          AWS_DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          AWS_CONTACT_RECIPIENT_EMAIL: ${{ secrets.CONTACT_RECIPIENT_EMAIL }}
          AWS_FRONTEND_ORIGINS: ${{ secrets.FRONTEND_ORIGINS }}
          AWS_PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
          AWS_PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
          AWS_PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
          AWS_PAYFAST_SANDBOX: ${{ secrets.PAYFAST_SANDBOX }}
          AWS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_PLATFORM_ORIGIN_HOST: ${{ secrets.PLATFORM_ORIGIN_HOST }}
          AWS_HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
          AWS_HUGGINGFACE_MODEL: ${{ secrets.HUGGINGFACE_MODEL }}
          AWS_HOSTAFRICA_API_EMAIL: ${{ secrets.HOSTAFRICA_API_EMAIL }}
          AWS_HOSTAFRICA_API_KEY: ${{ secrets.HOSTAFRICA_API_KEY }}
          AWS_WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          AWS_WHATSAPP_APP_ID: ${{ secrets.WHATSAPP_APP_ID }}
          AWS_WHATSAPP_CONFIG_ID: ${{ secrets.WHATSAPP_CONFIG_ID }}
          AWS_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          # SAM's --parameter-overrides shorthand rejects an empty value
          # outright, so optional params (not every deploy has these
          # secrets set) are only included when actually non-empty —
          # otherwise CloudFormation just uses the template's own Default.
          # A comma-separated value (FrontendOrigins) is safe here as long
          # as it stays one quoted array element, per SAM's own docs
          # (e.g. --parameter-overrides ServiceNames="Users,Orders,Products").
          OVERRIDES=(
            "DatabaseUrl=${AWS_DATABASE_URL}"
            "DjangoSecretKey=${AWS_DJANGO_SECRET_KEY}"
            "DjangoAllowedHosts=${AWS_DJANGO_ALLOWED_HOSTS}"
          )
          [ -n "${AWS_DEFAULT_FROM_EMAIL}" ] && OVERRIDES+=("DefaultFromEmail=${AWS_DEFAULT_FROM_EMAIL}")
          [ -n "${AWS_CONTACT_RECIPIENT_EMAIL}" ] && OVERRIDES+=("ContactRecipientEmail=${AWS_CONTACT_RECIPIENT_EMAIL}")
          [ -n "${AWS_FRONTEND_ORIGINS}" ] && OVERRIDES+=("FrontendOrigins=${AWS_FRONTEND_ORIGINS}")
          [ -n "${AWS_PAYFAST_MERCHANT_ID}" ] && OVERRIDES+=("PayFastMerchantId=${AWS_PAYFAST_MERCHANT_ID}")
          [ -n "${AWS_PAYFAST_MERCHANT_KEY}" ] && OVERRIDES+=("PayFastMerchantKey=${AWS_PAYFAST_MERCHANT_KEY}")
          [ -n "${AWS_PAYFAST_PASSPHRASE}" ] && OVERRIDES+=("PayFastPassphrase=${AWS_PAYFAST_PASSPHRASE}")
          # The template's AllowedValues are the literal strings
          # "true"/"false" and CloudFormation's check is exact — the
          # PAYFAST_SANDBOX secret is actually stored as "1"/"0" (a common
          # shape for a boolean env var), which fails that check outright
          # regardless of case/whitespace. Map every common boolean
          # spelling onto the two the template actually accepts.
          case "$(echo "${AWS_PAYFAST_SANDBOX}" | xargs | tr '[:upper:]' '[:lower:]')" in
            1|yes|on|true) PAYFAST_SANDBOX_NORMALIZED="true" ;;
            0|no|off|false) PAYFAST_SANDBOX_NORMALIZED="false" ;;
            *) PAYFAST_SANDBOX_NORMALIZED="" ;;
          esac
          [ -n "${PAYFAST_SANDBOX_NORMALIZED}" ] && OVERRIDES+=("PayFastSandbox=${PAYFAST_SANDBOX_NORMALIZED}")
          [ -n "${AWS_CLOUDFLARE_API_TOKEN}" ] && OVERRIDES+=("CloudflareApiToken=${AWS_CLOUDFLARE_API_TOKEN}")
          [ -n "${AWS_CLOUDFLARE_ACCOUNT_ID}" ] && OVERRIDES+=("CloudflareAccountId=${AWS_CLOUDFLARE_ACCOUNT_ID}")
          [ -n "${AWS_PLATFORM_ORIGIN_HOST}" ] && OVERRIDES+=("PlatformOriginHost=${AWS_PLATFORM_ORIGIN_HOST}")
          [ -n "${AWS_HUGGINGFACE_API_TOKEN}" ] && OVERRIDES+=("HuggingFaceApiToken=${AWS_HUGGINGFACE_API_TOKEN}")
          [ -n "${AWS_HUGGINGFACE_MODEL}" ] && OVERRIDES+=("HuggingFaceModel=${AWS_HUGGINGFACE_MODEL}")
          [ -n "${AWS_HOSTAFRICA_API_EMAIL}" ] && OVERRIDES+=("HostAfricaApiEmail=${AWS_HOSTAFRICA_API_EMAIL}")
          [ -n "${AWS_HOSTAFRICA_API_KEY}" ] && OVERRIDES+=("HostAfricaApiKey=${AWS_HOSTAFRICA_API_KEY}")
          [ -n "${AWS_WHATSAPP_ACCESS_TOKEN}" ] && OVERRIDES+=("WhatsAppAccessToken=${AWS_WHATSAPP_ACCESS_TOKEN}")
          [ -n "${AWS_WHATSAPP_APP_ID}" ] && OVERRIDES+=("WhatsAppAppId=${AWS_WHATSAPP_APP_ID}")
          [ -n "${AWS_WHATSAPP_CONFIG_ID}" ] && OVERRIDES+=("WhatsAppConfigId=${AWS_WHATSAPP_CONFIG_ID}")
          [ -n "${AWS_WHATSAPP_VERIFY_TOKEN}" ] && OVERRIDES+=("WhatsAppVerifyToken=${AWS_WHATSAPP_VERIFY_TOKEN}")

          sam deploy \
            --stack-name viincci-digital-builder \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides "${OVERRIDES[@]}"

      - name: Verify stack actually deployed
        working-directory: backend
        run: |
          set -e
          for i in 1 2 3 4 5; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name viincci-digital-builder \
              --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "MISSING")
            echo "Attempt $i: stack status = $STATUS"
            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE) break ;;
              *_IN_PROGRESS) sleep 15 ;;
              *)
                echo "::error::Stack viincci-digital-builder is not in a healthy state (status: $STATUS). sam deploy's exit code cannot be trusted alone — verifying here."
                exit 1
                ;;
            esac
          done
          if [[ "$STATUS" != "CREATE_COMPLETE" && "$STATUS" != "UPDATE_COMPLETE" ]]; then
            echo "::error::Stack never reached a completed state (last status: $STATUS)"
            exit 1
          fi
          echo "Stack outputs:"
          aws cloudformation describe-stacks \
            --stack-name viincci-digital-builder \
            --query "Stacks[0].Outputs" --output table
