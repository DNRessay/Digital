name: Cloudflare credentials check (temporary, read-only)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify API token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: List zones under the account (proves Account ID + Zone read work)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?account.id=$ACCOUNT_ID&per_page=50" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" | python3 -m json.tool

      - name: Check Email Routing addresses endpoint (proves account-level Email Routing permission)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/email/routing/addresses" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" | python3 -m json.tool
